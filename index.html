<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="貼り付けたテキストから重複した行を削除するツールです。">
  <title>重複行削除ツール</title>
  <style>
    :root {
      color-scheme: light;
      --background: #E9EDF5;
      --surface: #FFFFFF;
      --text: #24303D;
      --muted: #5C6B7A;
      --accent: #6C5CE0;
      --danger: #D93025;
      --border: #D7DEEA;
      --radius: 6px;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .page {
      width: min(100% - 32px, 560px);
      margin: 0 auto;
      padding: 32px 0 40px;
    }

    .page-header { margin-bottom: 24px; }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.4;
    }

    .lead {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .tool {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    textarea,
    button {
      display: block;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font: inherit;
      font-size: 16px;
    }

    textarea {
      min-height: 150px;
      padding: 12px;
      resize: vertical;
      background: var(--surface);
      color: var(--text);
      line-height: 1.5;
    }

    textarea::placeholder { color: var(--muted); }

    textarea[readonly] {
      margin-top: 16px;
      background: #F8F9FC;
    }

    .option {
      display: flex;
      align-items: center;
      min-height: 40px;
      margin-top: 8px;
      padding: 8px 0;
      color: var(--text);
      font-size: 14px;
      line-height: 1.4;
      white-space: nowrap;
      cursor: pointer;
    }

    .option input {
      width: 16px;
      height: 16px;
      margin: 0 8px 0 0;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }

    button {
      min-height: 44px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 700;
    }

    .run-button {
      margin-top: 8px;
      background: var(--accent);
      color: #FFFFFF;
    }

    .copy-button {
      margin-top: 16px;
      background: var(--surface);
      color: var(--text);
    }

    button:active { transform: translateY(1px); }

    textarea:focus-visible,
    .option:focus-within,
    button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .result,
    .copy-status {
      min-height: 24px;
      margin: 8px 0 0;
      font-size: 16px;
      line-height: 1.4;
      white-space: nowrap;
    }

    .result { color: var(--muted); }
    .copy-status { color: var(--accent); }
    .copy-status.is-error { color: var(--danger); }

    @media (max-width: 480px) {
      .page { padding-top: 24px; }
    }
  /* --- 運営者表記フッタ（全Day共通・Day037と同一仕様） -------------------
     ページごとに配色が違うため、ページ側のCSS変数に依存せず自己完結させる。
     ツール本体のスタイルには触れない。印刷時は表示しない。 */
  .mw-footer {
    box-sizing: border-box;
    width: 100%;
    max-width: 100%;
    margin: 24px 0 0;
    padding: 16px;
    background: #F7F7F8;
    border: 1px solid #D8D8DC;
    border-radius: 6px;
    color: #3A3A3E;
    font-family: system-ui, sans-serif;
    font-size: 12px;
    font-weight: 400;
    line-height: 1.7;
    text-align: left;
    overflow-wrap: anywhere;
  }
  .mw-footer p { margin: 0 0 6px; padding: 0; color: #3A3A3E; font-size: 12px; font-weight: 400; line-height: 1.7; text-align: left; }
  .mw-footer p:last-child { margin-bottom: 0; }
  .mw-footer a { color: #0B5AA6; }
  .mw-footer.mw-footer--page { width: calc(100% - 32px); max-width: 720px; margin: 24px auto; }
  @media print { .mw-footer { display: none; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>重複行削除ツール</h1>
      <p class="lead">貼り付けたテキストから、同じ行を取り除きます</p>
    </header>

    <section class="tool" aria-label="重複行削除">
      <textarea id="input" placeholder="例: メールアドレスや項目名を1行に1つずつ貼り付けてください" aria-label="重複を削除するテキスト"></textarea>

      <label class="option">
        <input id="trim" type="checkbox">
        前後の空白を無視して比較する
      </label>

      <button class="run-button" id="run" type="button">重複を削除する</button>
      <p class="result" id="result" aria-live="polite"></p>

      <textarea id="output" readonly aria-label="重複を削除した結果"></textarea>
      <button class="copy-button" id="copy" type="button">結果をコピー</button>
      <p class="copy-status" id="copy-status" role="status" aria-live="polite"></p>
    </section>
  <footer class="mw-footer">
    <p>みちAIワークス（MICHI AI WORKS）／代表 田中　泉</p>
    <p>運営: <a href="https://michi-portfolio.vercel.app/" rel="noopener">みちAIワークス 公式サイト</a>（https://michi-portfolio.vercel.app/ ）／ お問い合わせ: <a href="mailto:nncf123nncf@gmail.com">nncf123nncf@gmail.com</a></p>
    <p>このツールはブラウザの中だけで動きます。入力した内容は外部に送信しません。</p>
    <p>ログイン・会員登録・パスワードの入力を求めることはありません。</p>
  </footer>
  </main>

  <script>
    const input = document.querySelector('#input');
    const trimOption = document.querySelector('#trim');
    const output = document.querySelector('#output');
    const result = document.querySelector('#result');
    const copyButton = document.querySelector('#copy');
    const copyStatus = document.querySelector('#copy-status');

    function removeDuplicates() {
      const lines = input.value.split('\n');
      const seen = new Set();
      const uniqueLines = lines.filter((line) => {
        const key = trimOption.checked ? line.trim() : line;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });

      output.value = uniqueLines.join('\n');
      result.textContent = `${lines.length}行 → ${uniqueLines.length}行（${lines.length - uniqueLines.length}行削除）`;
      copyStatus.textContent = '';
      copyStatus.classList.remove('is-error');
    }

    async function copyResult() {
      const text = output.value;
      copyStatus.classList.remove('is-error');

      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          output.focus();
          output.select();
          if (!document.execCommand('copy')) throw new Error('Copy failed');
          output.setSelectionRange(0, 0);
        }
        copyStatus.textContent = 'コピーしました';
      } catch {
        copyStatus.textContent = 'コピーできませんでした';
        copyStatus.classList.add('is-error');
      }
    }

    document.querySelector('#run').addEventListener('click', removeDuplicates);
    copyButton.addEventListener('click', copyResult);
  </script>
</body>
</html>
